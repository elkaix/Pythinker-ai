name: Build native installers

# Builds per-platform PyInstaller bundles, .deb / .rpm / .exe installers, and
# tarballs on every release publish (manual workflow_dispatch also supported).
#
# All untrusted inputs (release tag name, workflow_dispatch tag input,
# GITHUB_REF) flow through `env:` blocks before being referenced in shell
# code — see GitHub's actions-injection guidance.
#
# Artifacts produced (uploaded to the same GitHub Release):
#   * pythinker-{ver}-x86_64-unknown-linux-gnu.tar.gz   (+ .sha256)
#   * pythinker-{ver}-aarch64-unknown-linux-gnu.tar.gz  (+ .sha256)
#   * pythinker-{ver}-aarch64-apple-darwin.tar.gz       (+ .sha256)
#   * pythinker-ai_{ver}_amd64.deb                      (+ .sha256)
#   * pythinker-ai_{ver}_arm64.deb                      (+ .sha256)
#   * pythinker-ai-{ver}.x86_64.rpm                     (+ .sha256)
#   * pythinker-ai-{ver}.aarch64.rpm                    (+ .sha256)
#   * PythinkerSetup-{ver}.exe                          (+ .sha256)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v2.7.0). Optional; defaults to the workflow ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
          else
            TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          fi
          VER="${TAG#v}"
          PYPROJECT_VER=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ -n "${TAG}" ] && [ "${VER}" != "${PYPROJECT_VER}" ]; then
            echo "::error::tag ${VER} does not match pyproject.toml ${PYPROJECT_VER}"
            exit 1
          fi
          [ -n "${VER}" ] || VER="${PYPROJECT_VER}"
          echo "version=${VER}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${VER}"    >>"${GITHUB_OUTPUT}"

  build-bundle:
    name: Build PyInstaller bundle (${{ matrix.target }})
    needs: resolve-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            os: linux
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            os: linux
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            os: macos
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            os: windows
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TARGET: ${{ matrix.target }}
      RUNNER_OS_FAMILY: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ".[all]" || python -m pip install .
          python -m pip install pyinstaller==6.11.1

      - name: Run PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller packaging/pyinstaller/pythinker.spec --clean --noconfirm

      - name: Smoke-test bundle (`pythinker --version`)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS_FAMILY}" = "windows" ]; then
            ./dist/pythinker/pythinker.exe --version
          else
            ./dist/pythinker/pythinker --version
          fi

      - name: Pack tarball (non-Windows)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          NAME="pythinker-${VERSION}-${TARGET}.tar.gz"
          tar -czf "artifacts/${NAME}" -C dist pythinker
          (cd artifacts && shasum -a 256 "${NAME}" > "${NAME}.sha256")

      - name: Build .deb (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev
          case "${TARGET}" in
            x86_64-unknown-linux-gnu)  ARCH=amd64 ;;
            aarch64-unknown-linux-gnu) ARCH=arm64 ;;
            *) echo "no deb for ${TARGET}"; exit 0 ;;
          esac
          ARCH="${ARCH}" VERSION="${VERSION}" BUNDLE="$(pwd)/dist/pythinker" OUTDIR="$(pwd)/artifacts" \
            bash packaging/deb/build-deb.sh

      - name: Build .rpm (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends rpm
          case "${TARGET}" in
            x86_64-unknown-linux-gnu)  ARCH=x86_64  ;;
            aarch64-unknown-linux-gnu) ARCH=aarch64 ;;
            *) echo "no rpm for ${TARGET}"; exit 0 ;;
          esac
          ARCH="${ARCH}" VERSION="${VERSION}" BUNDLE="$(pwd)/dist/pythinker" OUTDIR="$(pwd)/artifacts" \
            bash packaging/rpm/build-rpm.sh

      - name: Build Inno Setup installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc /DAppVersion=$env:VERSION packaging\inno\pythinker.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem dist\windows\PythinkerSetup-*.exe | ForEach-Object {
            Copy-Item $_.FullName artifacts/
          }
          Get-ChildItem artifacts\PythinkerSetup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ASCII "$($_.FullName).sha256"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7

  attach-to-release:
    name: Attach artifacts to GitHub Release
    needs: [resolve-version, build-bundle]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: native-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release upload "${TAG}" artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
