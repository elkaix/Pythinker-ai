name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      # setup-uv does not publish a floating v8 major tag; pin to v8.1.0 SHA.
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Lint with ruff
      run: uv run ruff check pythinker --select F401,F841

    - name: Run tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: uv run pytest tests/ --cov=pythinker --cov-report=xml

    - name: Run tests
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
      run: uv run pytest tests/

    - name: Upload coverage XML
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error

  webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.13"

    - name: Set up Python (for webui hash check)
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install WebUI dependencies
      working-directory: webui
      run: bun install --frozen-lockfile

    - name: Lint WebUI
      working-directory: webui
      run: bun run lint

    - name: Test WebUI
      working-directory: webui
      run: bun run test

    - name: Build WebUI
      working-directory: webui
      run: bun run build

    - name: Verify webui dist freshness
      run: python scripts/webui_hash.py --check

    - name: Build wheel
      run: |
        python -m pip install build
        python -m build --wheel

    - name: Verify wheel contains WebUI bundle
      run: python scripts/check_wheel_webui.py

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [test, webui]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Verify required CI jobs passed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WEBUI_RESULT: ${{ needs.webui.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "test job result: $TEST_RESULT"
            exit 1
          fi
          if [[ "$WEBUI_RESULT" != "success" ]]; then
            echo "webui job result: $WEBUI_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
